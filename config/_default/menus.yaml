# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: '/#bio'
    weight: 10
  - name: Papers
    url: '/#papers'
    weight: 11
  - name: Experience
    url: '/experience/'
    weight: 20
  - name: Projects
    url: '/projects/'
    weight: 30

# 日本語メニュー（言語コード .ja を付与）
main.ja:
  - name: 自己紹介
    url: '/ja/#bio'
    weight: 10
  - name: 論文
    url: '/ja/#papers'
    weight: 11
  - name: 経歴
    url: '/ja/experience/'
    weight: 20
  - name: プロジェクト
    url: '/ja/projects/'
    weight: 30
