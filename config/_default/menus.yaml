# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: '/#bio'
    weight: 10
  - name: Papers
    url: '/#papers'
    weight: 11
  - name: Experience
    url: '/experience/'
    weight: 20
  - name: Projects
    url: '/projects/'
    weight: 30

# 日本語メニュー
main.ja:
  - name: 自己紹介
    url: '#bio'          # ← 日本語トップ内にいるなら '#bio' だけでその位置へ飛びます
    weight: 10
  - name: 論文
    url: '#papers'       # ← 同様に '#papers' で飛びます
    weight: 11
  - name: 経歴
    url: 'experience/'   # ← 先頭の '/ja/' や '/' は付けず 'experience/' にします
    weight: 20
  - name: プロジェクト
    url: 'projects/'     # ← 先頭のスラッシュを外します
    weight: 30
