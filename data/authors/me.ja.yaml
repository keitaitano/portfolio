bio: |
  海洋研究開発機構（JAMSTEC）の研究員として、地球化学および地球科学への機械学習の応用を専門としています。鉱物の地球化学や同位体分析に加え、地質学的プロセスを理解するためのデータ駆動型アプローチに取り組んでいます。高度な分析技術と機械学習を組み合わせ、地球の歴史や鉱物資源の解明を目指しています。

