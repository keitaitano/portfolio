bio: |
  地球化学および機械学習の地球科学への応用を専門に研究しています。鉱物地球化学、同位体分析、そしてデータ駆動型アプローチを融合させ、固体地球から表層環境、さらには地球史に至る多様な地質プロセスの解明に取り組んでいます。
  
  火成岩岩石学や固体地球システムを中心とした研究に加え、共通の分析化学やデータ解析技術を活かし、材料科学分野への学際的な研究にも取り組んでいます。新しいアイデアや分野横断的な共同研究を歓迎しています。ぜひお気軽にご連絡ください！


